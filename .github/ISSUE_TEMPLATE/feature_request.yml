name: ✨ Feature Request
description: Propose a new feature, AI diagnostic model, or improvement for CareAI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new diagnostic capability for CareAI!
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Deep Learning Model / Computer Vision
        - Clinical Screening Panel
        - Conversational AI & Medical Triage
        - Security & Anonymization (HIPAA/GDPR)
        - Performance & Vite Tooling
        - Mobile & Offline PWA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Clinical Need
      description: Is your feature request related to a specific problem or medical workflow?
      placeholder: Describe the clinical need or user challenge...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional Context / Dataset References
      description: HAM10000, TCGA-GBM, OASIS neuroimaging, or academic papers.
