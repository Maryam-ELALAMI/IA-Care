name: 🐛 Bug Report
description: Report an issue or unexpected behavior in IA-Care
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: module
    attributes:
      label: Affected Diagnostic Module
      description: Select which section of CareAI is experiencing the problem
      options:
        - Skin Cancer Detection (/Skin)
        - Brain Tumor Detection (/BrainCancer)
        - Alzheimer's Screening (/Alzheimers)
        - Parkinson's Assessment (/Parkinson)
        - Healthcare Chatbot (/Chatbot)
        - Sidebar Navigation / Routing
        - Build / Tooling (Vite, Sass, ESLint)
        - CI/CD & GitHub Pages Deployment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Navigate to '...'
        2. Upload sample image '...'
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Browser, OS version, Node version.
      placeholder: Chrome 129, Windows 11, Node v20.x
    validations:
      required: false
